<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Dice 🎲 | Color Dice &amp; Wheel Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet" />

  <!-- SDK Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
:root {
  --primary-blue: #3399ff;
  --light-blue: #66b3ff;
  --dark-blue: #0066cc;
  --background-start: #3e6d9d;
  --background-end: #1a3a5a;
  --white: #ffffff;
  --shadow-dark: rgba(0, 0, 0, 0.4);
  --shadow-light: rgba(255, 255, 255, 0.8);
  --text-yellow: #ffcc00;
}

* { box-sizing: border-box; }

body {
  position: relative;
  min-height: 100vh;
  margin: 0 auto;
  padding: 0 0 50px;
  overflow-x: hidden;
  overflow-y: auto;
  background: radial-gradient(circle at center, var(--background-start) 0%, var(--background-end) 90%);
  font-family: "Luckiest Guy", cursive;
  text-align: center;
}

.bg-overlay {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 150%;
  background: url("pic/background.png") repeat;
  background-size: 35% auto;
  opacity: 0.85; z-index: -1; pointer-events: none;
}

.bg-overlay-2 {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 150%;
  background: url("pic/light.png") no-repeat;
  background-size: 125% auto;
  opacity: 0.75; z-index: -1; pointer-events: none;
}

.top-header { padding: 30px 0 10px; display: flex; flex-direction: column; align-items: center; }

.top-tagline {
  margin-top: 5px; font-size: 32px; color: var(--white);
  text-shadow: 4px 4px 0 var(--dark-blue), 6px 6px 10px var(--shadow-dark);
  -webkit-text-stroke: 1px var(--dark-blue);
}

.wrapper {
  width: 90%; max-width: 700px; padding: 20px; margin: 20px auto;
  border-radius: 25px; border: 5px solid var(--white);
  background-color: rgba(255, 255, 255, 0.15); backdrop-filter: blur(5px);
  box-shadow: 0 10px 20px var(--shadow-dark);
  display: flex; flex-direction: column; align-items: center;
}

.title {
  font-size: 52px; color: var(--white);
  text-shadow: 6px 6px 0 var(--dark-blue), 8px 8px 10px var(--shadow-dark);
  margin-bottom: 25px; -webkit-text-stroke: 1.5px var(--dark-blue);
}

.dropdown-container { display: flex; gap: 20px; margin-bottom: 30px; width: 100%; justify-content: center; }

select {
  font-family: "Luckiest Guy", cursive; font-size: 24px; padding: 12px 20px;
  width: 325px; max-width: 100%; border: 4px solid var(--primary-blue);
  border-radius: 10px; background-color: var(--white); color: var(--dark-blue); cursor: pointer;
}

button {
  width: 93%; padding: 15px 50px;
  background: linear-gradient(to bottom, var(--light-blue), var(--primary-blue));
  color: var(--white); font-family: "Luckiest Guy", cursive; font-size: 32px;
  border: 4px solid var(--white); border-radius: 12px; cursor: pointer;
  box-shadow: 0 8px 15px var(--shadow-dark); -webkit-text-stroke: 1px var(--dark-blue);
}

.secondary-btn {
  background: linear-gradient(to bottom, #ffff33, #ffcc00);
  font-size: 22px; padding: 10px 25px; margin-top: 15px; width: auto;
  -webkit-text-stroke: 1px #b38f00;
}

.dice-result { margin: 20px auto; padding: 10px; width: 90%; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }

.color-block {
  width: 90px; height: 90px; border-radius: 25px; border: 10px solid var(--white);
  position: relative; background-color: #b0b0b0; box-shadow: 6px 6px 12px rgba(0, 0, 0, 0.3);
}

.dot {
  width: 18px; height: 18px; background-color: var(--white); border-radius: 50%;
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
}

.wheel-wrapper { display: flex; flex-direction: column; align-items: center; margin-bottom: 0; }

.single-wheel-container {
  width: 380px; height: 380px; position: relative; overflow: hidden;
  margin: 20px 0; border-radius: 50%; border: 20px solid var(--white);
}

.wheel { width: 100%; height: 100%; border-radius: 50%; position: absolute; }

.color-container {
  font-family: sans-serif; width: 90%; background-color: rgba(0, 0, 0, 0.3);
  padding: 10px 20px; margin-top: 20px; border-radius: 10px; color: var(--white);
}

/* ADMIN PANEL */
.admin-panel {
  display: none; background: rgba(0, 0, 0, 0.8); padding: 15px;
  border-radius: 15px; margin: 20px auto; border: 3px dashed var(--text-yellow);
  width: 90%; max-width: 650px; color: white; font-family: sans-serif;
}

.user-status-bar {
  display: none; position: absolute; top: 20px; right: 20px; align-items: center; gap: 12px; z-index: 100;
}

.user-display-name { color: var(--text-yellow); font-size: 22px; font-family: 'Luckiest Guy', cursive; }

#logout-btn { width: auto; padding: 6px 12px; font-size: 14px; background: #ff4d4d; border-radius: 6px; border: 1px solid white;}

/* LOGIN OVERLAY */
#login-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.92); z-index: 9999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
  </style>
</head>
<body>

  <!-- STATUS BAR -->
  <div id="user-status-bar" class="user-status-bar">
    <span id="user-display-name" class="user-display-name"></span>
    <button id="logout-btn">DÉCONNECTER</button>
  </div>

  <!-- ECRAN DE LOGIN -->
  <div id="login-overlay">
    <h2 style="color:var(--text-yellow); font-family:'Luckiest Guy', cursive; font-size:48px; margin-bottom:20px;">BIENVENUE</h2>
    <input type="text" id="pseudo-input" placeholder="Entrez votre pseudo..." style="padding:15px; font-size:24px; font-family:'Luckiest Guy', cursive; border-radius:10px; border:4px solid var(--primary-blue); text-align:center; margin-bottom:20px; width:320px; outline:none;">
    <button id="login-btn" style="width:auto; padding:12px 40px; font-size:28px;">JOUER</button>
  </div>

  <header class="top-header">
    <div class="top-tagline">COLOR GAME &amp; LIGHT OR DARK</div>
  </header>

  <div class="wrapper">
    <div class="title">COLOR DICE</div>
    <div class="dropdown-container">
      <select id="numDice">
        <option value="1">1 Dice</option>
        <option value="2">2 Dice</option>
        <option value="3">3 Dice</option>
        <option value="4">4 Dice</option>
      </select>
      <select id="colorDice">
        <option value="color">Color Dice</option>
        <option value="lightOrDark">Light or Dark Wheel</option>
      </select>
    </div>

    <div id="diceResultArea" class="dice-result"></div>

    <div id="wheelWrapper" class="wheel-wrapper" style="display: none">
      <div class="single-wheel-container">
        <div id="lightDarkWheel" class="wheel"></div>
      </div>
      <div id="winnerText" style="font-size:32px; color:var(--text-yellow);"></div>
    </div>

    <button id="rollButton" type="button">ROLL AGAIN !</button>

    <div class="color-container">
      <div id="colorInfo"></div>
    </div>
  </div>

  <!-- PANNEAU ADMIN -->
  <div id="admin-panel" class="admin-panel">
    <h3 style="color:var(--text-yellow); margin-top:0;">PANNEAU ADMIN</h3>
    <p>Joueurs en ligne : <strong id="online-count" style="color:var(--text-yellow); font-size:20px;">0</strong></p>
    <div style="margin-bottom:10px;">
      <label>Joueur ciblé : </label>
      <select id="target-player-select" style="width:200px; font-size:16px; padding:4px;"></select>
    </div>
  </div>

  <script>
    // 1. INITIALISATION FIREBASE
    const firebaseConfig = {
      databaseURL: "https://color-dice-e45c8-default-rtdb.firebaseio.com"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    let currentUserRef = null;

    const loginOverlay = document.getElementById('login-overlay');
    const loginBtn = document.getElementById('login-btn');
    const pseudoInput = document.getElementById('pseudo-input');
    const adminPanel = document.getElementById('admin-panel');
    const logoutBtn = document.getElementById('logout-btn');
    const userStatusBar = document.getElementById('user-status-bar');
    const userDisplayName = document.getElementById('user-display-name');
    const onlineCountElem = document.getElementById('online-count');
    const targetPlayerSelect = document.getElementById('target-player-select');

    // CONSOLIDATION PRESENCE EN TEMPS REEL
    function registerOnlineUser(pseudo) {
      const sessionId = 'user_' + Math.random().toString(36).substring(2, 9);
      currentUserRef = db.ref('online_users/' + sessionId);

      currentUserRef.set({
        pseudo: pseudo,
        time: Date.now()
      });

      currentUserRef.onDisconnect().remove();
    }

    // ECOUTE DE LA LISTE EN TEMPS REEL
    db.ref('online_users').on('value', (snapshot) => {
      const users = snapshot.val() || {};
      const onlinePseudos = [];

      for (let key in users) {
        if (users[key] && users[key].pseudo) {
          onlinePseudos.push(users[key].pseudo);
        }
      }

      onlineCountElem.textContent = onlinePseudos.length;
      targetPlayerSelect.innerHTML = '<option value="">-- Aucun Joueur --</option>';

      onlinePseudos.forEach((p) => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        targetPlayerSelect.appendChild(opt);
      });
    });

    // LOGIN
    loginBtn.addEventListener('click', () => {
      const pseudo = pseudoInput.value.trim();
      if (!pseudo) return alert('Entre un pseudo !');

      userDisplayName.textContent = pseudo;
      userStatusBar.style.display = 'flex';
      loginOverlay.style.display = 'none';

      registerOnlineUser(pseudo);

      if (pseudo.toLowerCase() === 'anaco admin 555') {
        adminPanel.style.display = 'block';
      }
    });

    logoutBtn.addEventListener('click', () => {
      if (currentUserRef) currentUserRef.remove();
      location.reload();
    });

    // LOGIQUE DE JEU SIMPLE
    const numDiceSelect = document.getElementById("numDice");
    const diceResultArea = document.getElementById("diceResultArea");

    function renderDice() {
      diceResultArea.innerHTML = "";
      const count = parseInt(numDiceSelect.value, 10);
      for (let i = 0; i < count; i++) {
        const block = document.createElement("div");
        block.className = "color-block";
        const dot = document.createElement("div");
        dot.className = "dot";
        block.appendChild(dot);
        diceResultArea.appendChild(block);
      }
    }

    document.getElementById("rollButton").addEventListener("click", () => {
      const colors = ["red", "orange", "#ffcc00", "green", "blue", "purple"];
      const blocks = document.querySelectorAll(".color-block");
      blocks.forEach(b => {
        b.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      });
    });

    numDiceSelect.addEventListener("change", renderDice);
    renderDice();
  </script>
</body>
</html>
